services:
  # Backend (FastAPI)
  # PostgreSQL i Redis są teraz osobnymi zasobami Coolify (nie w compose)
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    environment:
      DATABASE_URL: ${DATABASE_URL:?DATABASE_URL is required}
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET is required}
      OPENAI_API_KEY: ${OPENAI_API_KEY:?OPENAI_API_KEY is required}
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY:-}
      ENVIRONMENT: ${ENVIRONMENT:-production}
      DEBUG: ${DEBUG:-false}
      CORS_ORIGINS: ${CORS_ORIGINS:?CORS_ORIGINS is required}
      FRONTEND_URL: ${FRONTEND_URL:-}
      REDIS_URL: ${REDIS_URL:?REDIS_URL is required}
      SMTP_SERVER: ${SMTP_SERVER:-smtp.gmail.com}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USERNAME: ${SMTP_USERNAME:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      SMTP_FROM_EMAIL: ${SMTP_FROM_EMAIL:-}
      SMTP_FROM_NAME: ${SMTP_FROM_NAME:-TalentPilot}
      # Billing (docs/BRIEF_BILLING_TRIAL.md §6). All optional-with-blank-
      # default so today's deploy (BILLING_PROVIDER unset -> "disabled")
      # keeps working unchanged until these are set from Coolify.
      BILLING_PROVIDER: ${BILLING_PROVIDER:-disabled}
      BILLING_WEBHOOK_SECRET: ${BILLING_WEBHOOK_SECRET:-}
      STRIPE_SECRET_KEY: ${STRIPE_SECRET_KEY:-}
      STRIPE_WEBHOOK_SECRET: ${STRIPE_WEBHOOK_SECRET:-}
      STRIPE_PRICE_PRO_MONTHLY: ${STRIPE_PRICE_PRO_MONTHLY:-}
      STRIPE_PRICE_PRO_YEARLY: ${STRIPE_PRICE_PRO_YEARLY:-}
      STRIPE_PRICE_STUDIO_MONTHLY: ${STRIPE_PRICE_STUDIO_MONTHLY:-}
      STRIPE_PRICE_STUDIO_YEARLY: ${STRIPE_PRICE_STUDIO_YEARLY:-}
    networks:
      - default
      - coolify
    # Backend joins two networks: 'default' (per-stack, with frontend) and 'coolify'
    # (shared, for standalone Postgres/Redis resources). Without this label Traefik
    # cannot decide which IP to route to, so the api.talentpilot.io router silently
    # fails to register. Pin proxy traffic to the 'coolify' network where the
    # coolify-proxy container also lives.
    #
    # TLS for *.talentpilot.io is served via a Cloudflare Origin Certificate
    # (valid until 2041-05-11) configured outside this compose file at
    # /data/coolify/proxy/dynamic/talentpilot-{origin.crt,origin.key,tls.yaml}
    # on the host. Coolify's auto-generated tls.certresolver=letsencrypt label
    # cannot be overridden from compose (Coolify dedupes and its version wins),
    # so the LE entries for these domains were removed from
    # /data/coolify/proxy/acme.json — Traefik then falls back to the static
    # Origin Cert by SNI. Cloudflare SSL mode for the zone is Full (strict).
    labels:
      - traefik.docker.network=coolify
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 10s
      timeout: 10s
      retries: 10
      start_period: 120s
    command: ["sh", "start.sh"]
    restart: unless-stopped

  # Frontend (Next.js)
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      # NEXT_PUBLIC_* must be passed at BUILD time so `next build` can inline
      # the value into the client-side JS bundle. Setting only `environment`
      # below would leave the public URL undefined in the browser.
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:?NEXT_PUBLIC_API_URL is required}
    environment:
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:?NEXT_PUBLIC_API_URL is required}
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped

networks:
  coolify:
    external: true
