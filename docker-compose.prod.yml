services:
  # Backend (FastAPI)
  # PostgreSQL i Redis są teraz osobnymi zasobami Coolify (nie w compose)
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    environment:
      DATABASE_URL: ${DATABASE_URL:?DATABASE_URL is required}
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET is required}
      OPENAI_API_KEY: ${OPENAI_API_KEY:?OPENAI_API_KEY is required}
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY:-}
      ENVIRONMENT: ${ENVIRONMENT:-production}
      DEBUG: ${DEBUG:-false}
      CORS_ORIGINS: ${CORS_ORIGINS:?CORS_ORIGINS is required}
      FRONTEND_URL: ${FRONTEND_URL:-}
      REDIS_URL: ${REDIS_URL:?REDIS_URL is required}
      SMTP_SERVER: ${SMTP_SERVER:-smtp.gmail.com}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USERNAME: ${SMTP_USERNAME:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      SMTP_FROM_EMAIL: ${SMTP_FROM_EMAIL:-}
      SMTP_FROM_NAME: ${SMTP_FROM_NAME:-TalentPilot}
    networks:
      - default
      - coolify
    # Backend joins two networks: 'default' (per-stack, with frontend) and 'coolify'
    # (shared, for standalone Postgres/Redis resources). Without this label Traefik
    # cannot decide which IP to route to, so the api.talentpilot.io router silently
    # fails to register. Pin proxy traffic to the 'coolify' network where the
    # coolify-proxy container also lives.
    # Override Coolify's generated certresolver=letsencrypt for the api router.
    # We serve a Cloudflare Origin Certificate (15-year, *.talentpilot.io) from
    # /traefik/dynamic/talentpilot-tls.yaml. Empty certresolver makes Traefik
    # skip ACME and use the static cert matched by SNI.
    # The UUID below is the Coolify resource UUID for this application — stable
    # for the life of the resource. Coolify does not expand env vars inside
    # compose-time labels, so it must be literal.
    labels:
      - traefik.docker.network=coolify
      - "traefik.http.routers.https-0-vkppfv54xt5zvdli2pwqcv5d-backend.tls.certresolver="
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 10s
      timeout: 10s
      retries: 10
      start_period: 120s
    command: ["sh", "start.sh"]
    restart: unless-stopped

  # Frontend (Next.js)
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    environment:
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:?NEXT_PUBLIC_API_URL is required}
    # Same as backend: use Cloudflare Origin Certificate via dynamic config, skip ACME.
    labels:
      - "traefik.http.routers.https-0-vkppfv54xt5zvdli2pwqcv5d-frontend.tls.certresolver="
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped

networks:
  coolify:
    external: true
